# Codemagic CI/CD for WIIN (Flutter iOS -> TestFlight)
# ---------------------------------------------------------------------------
# No Mac required: Codemagic builds on hosted macOS. Nothing secret lives here.
#
# BEFORE the first run — the full step-by-step is in ../IOS-BUILD-STEPS.md.
# In short:
#   1. developer.apple.com -> Certificates, IDs & Profiles -> Identifiers:
#      register App ID com.wiinalgeria.wiinz WITH the "Push Notifications"
#      capability ticked. The app ships an aps-environment entitlement, so a
#      profile without that capability fails the build at the signing step.
#   2. App Store Connect -> Apps -> + : create the app record for that bundle id.
#   3. App Store Connect -> Users and Access -> Integrations -> App Store Connect
#      API: create a key with the App Manager role, download the .p8 ONCE.
#   4. Codemagic -> Teams -> Integrations -> App Store Connect: add that key and
#      name it exactly "WIINZ ASC Key" (or change `integrations` below to match).
#   5. Connect the GitHub repo (wiinalgeria/wiinz_app) and run this workflow.
# ---------------------------------------------------------------------------

workflows:
  ios-testflight:
    name: WIIN iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # Must match the App Store Connect API key name created in the Codemagic UI.
      app_store_connect: WIINZ ASC Key

    environment:
      # NOTE: deliberately NO `ios_signing:` block here. That shorthand only
      # FETCHES existing signing files, so on a brand-new Apple account — which
      # has no distribution certificate and no provisioning profile yet — it
      # fails with "No matching profiles found for bundle identifier ... and
      # distribution type app_store". The explicit script below passes --create,
      # which makes Apple mint both on the first run.
      groups:
        # Codemagic UI → app settings → Environment variables. Must contain
        # CERTIFICATE_PRIVATE_KEY (marked Secure): the RSA private key that the
        # iOS distribution certificate is issued against. See the signing step.
        - ios_signing
      vars:
        BUNDLE_ID: "com.wiinalgeria.wiinz"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      # This step is load-bearing and easy to drop: it writes
      # ios/Flutter/Generated.xcconfig, which the committed Podfile reads to find
      # FLUTTER_ROOT. Without it `pod install` aborts on the very first build.
      - name: Generate iOS build config
        script: flutter build ios --config-only --no-codesign

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      # Automatic code signing, the explicit form. Credentials come from the
      # `integrations.app_store_connect` key above (exported as
      # APP_STORE_CONNECT_* env vars), so nothing secret lives in this file.
      #
      # --create lets Apple mint the distribution certificate and the App Store
      # provisioning profile if they don't exist yet. After the first successful
      # build they do exist and this just fetches them.
      #
      # ⚠️ --certificate-key is NOT optional when creating. A certificate is
      # issued against a private key you own, so without one the tool logs
      # "Cannot save Signing Certificates without certificate private key",
      # saves no .p12, and every later step quietly produces nothing — the
      # keychain ends up empty and `flutter build ipa` fails with the misleading
      # "No valid code signing certificates were found".
      #
      # ⚠️ Keep using the SAME private key. A new key means a new certificate on
      # every build, and Apple caps distribution certificates per account.
      - name: Set up code signing settings on Xcode project
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

      # ⚠️ --build-name is READ FROM pubspec.yaml, not hardcoded. It used to say
      # 1.0.0 literally, which is a trap: bumping pubspec to 1.0.1 for a new App
      # Store version would still have produced a 1.0.0 build, and App Store
      # Connect will not let you attach a 1.0.0 build to a 1.0.1 version — you
      # only find out after a full build + upload cycle.
      #
      # The version line is `version: 1.0.1+4`; strip the label and the +N, since
      # the build number comes from Codemagic's own counter below.
      - name: Flutter build ipa
        script: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "Building marketing version $BUILD_NAME (build $BUILD_NUMBER)"
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      # Uses the same ASC API key integration to upload the .ipa to TestFlight.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Optional: auto-add the build to an internal tester group once processed.
        # beta_groups:
        #   - Internal Testers
